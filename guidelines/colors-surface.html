<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;background:var(--surface-page)}.row{display:grid;gap:14px}.chip{height:64px}.hx{font-size:13px;font-weight:600;color:var(--text-body);margin-top:8px;letter-spacing:.02em}.u{font-size:11.5px;color:var(--text-muted);margin-top:1px}.lbl{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted);margin-bottom:10px}</style></head><body><div class="row" style="grid-template-columns:repeat(5,1fr)"><div><div class="chip" style="background:#FFFFFF;box-shadow:inset 0 0 0 1px #ECE6DA"></div><div class="hx">#FFFFFF</div><div class="u">fundo principal, cards</div></div><div><div class="chip" style="background:#FAF6EB;box-shadow:inset 0 0 0 1px #ECE6DA"></div><div class="hx">#FAF6EB</div><div class="u">sidebar, áreas sutis</div></div><div><div class="chip" style="background:#ECE6DA;"></div><div class="hx">#ECE6DA</div><div class="u">divisórias</div></div><div><div class="chip" style="background:#222222;"></div><div class="hx">#222222</div><div class="u">texto</div></div><div><div class="chip" style="background:#495D64;"></div><div class="hx">#495D64</div><div class="u">texto secundário</div></div></div></body></html>
